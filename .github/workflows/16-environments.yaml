name: 16 - Working with Envirnments
# run-name: 16-working with env | env - ${{ inputs.target-env }}
on: 
    workflow_dispatch:
        # inputs:
        #     target-env:
        #         type: environment
        #         default: staging
jobs:
    deploy-staging:
        runs-on: ubuntu-latest
        environment: staging
        env:
            my-env-value: ${{ vars.MY_ENV_VALUE || 'default value'}}
        steps:
            - name: Echo Vars
              run: |
                echo "Deploying to staging"
    e2e-tests:
        runs-on: ubuntu-latest
        needs: deploy-staging
        steps:
            - name: E2E tests
              run: echo "Running E@E"
    deploy-prod-frontend:
        runs-on: ubuntu-latest
        needs: e2e-tests
        environment: prod
        env:
            my-env-value: ${{ vars.MY_ENV_VALUE || 'default value'}}
        steps:
            - name: Echo Vars
              run: |
                echo "Deploying Prod Frontend"
    deploy-prod-backend1:
        runs-on: ubuntu-latest
        needs: e2e-tests
        environment: prod
        env:
            my-env-value: ${{ vars.MY_ENV_VALUE || 'default value'}}
        steps:
            - name: Echo Vars
              run: |
                echo "Deploying Prod Backend 1"
    deploy-prod-backend2:
        runs-on: ubuntu-latest
        needs: e2e-tests
        environment: prod
        env:
            my-env-value: ${{ vars.MY_ENV_VALUE || 'default value'}}
        steps:
            - name: Echo Vars
              run: |
                echo "Deploying Prod Backend 2"
