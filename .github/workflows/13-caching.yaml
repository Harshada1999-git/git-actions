name: 13 - using caching
on:
    workflow_dispatch:
        inputs:
            use-cache:
                type: boolean
                description: Whether to execute cache step
                default: true
            node-version:
              description: Node Version
              type: choice
              options:
                - 18.x
                - 20.x
                
                - 21.x
              default: 20.x
                
jobs:
    install-deps:
       runs-on: ubuntu-latest
       defaults:
            run:
                working-directory: 13-caching/react-app
       outputs:
         deps-cache-key: ${{ steps.cache-key.outputs.CACHE_KEY}}
       steps:
            # 1. checkout code
            - name: Checkout Code
              uses: actions/checkout@v4
            - name: Setup Node
              uses: actions/setup-node@v3
              with:
                node-version: ${{ inputs.node-version }}
            - name: Calculate cache key
              id: cache-key
              run: |
                echo "CACHE_KEY=deps-node-modules-${{ hashFiles('13-caching/react-app/package-lock.json')}}" >> "$GITHUB_OUTPUT"
                # node-version: '20.x'
            # 2. install dependencies
            - name: Download cache Dependencies
              uses: actions/cache@v3
              if: ${{ inputs.use-cache}}
              id: cache
              with:
                path: 13-caching/react-app/node_modules
                key: ${{ steps.cache-key.outputs.CACHE_KEY }}
            - name: Install Dependencies
              if: steps.cache.outputs.cache-hit != 'true'
              run: npm ci          
    lint-test:
        runs-on: ubuntu-latest
        needs: install-deps
        defaults:
            run:
                working-directory: 13-caching/react-app
        steps:
            # 1. checkout code
            - name: Checkout Code
              uses: actions/checkout@v4
            - name: Setup Node
              uses: actions/setup-node@v3
              with:
                node-version: ${{ inputs.node-version }}
                # node-version: '20.x'
            # 2. install dependencies
            - name: Download cache Dependencies
              uses: actions/cache@v3
              if: ${{ inputs.use-cache}}
              id: cache
              with:
                path: 13-caching/react-app/node_modules
                key: ${{ needs.install-deps.outputs.deps-cache-key }}
            # - name: Install Dependencies
                if: steps.cache.outputs.cache-hit != 'true'
                run: npm ci
              # 3. unit testing, building
            - name: Testing
              run: npm run test
            - name: Linting
              run: echo "Linting...."
              # 4. deploy to nonprod env
            # - name: Deploying yo nonprod
            #   run: echo "Deploying to nonprod"
    build:
        runs-on: ubuntu-latest
        needs: install-deps
        defaults:
            run:
                working-directory: 13-caching/react-app
        steps:
            # 1. checkout code
            - name: Checkout Code
              uses: actions/checkout@v4
            - name: Setup Node
              uses: actions/setup-node@v3
              with:
                node-version: ${{ inputs.node-version }}
                # node-version: '20.x'
            # 2. install dependencies
            - name: Download cache Dependencies
              uses: actions/cache@v3
              if: ${{ inputs.use-cache}}
              id: cache
              with:
                path: 13-caching/react-app/node_modules
                key: ${{ needs.install-deps.outputs.deps-cache-key }}
            # - name: Install Dependencies
              # if: steps.cache.outputs.cache-hit != 'true'
            #   run: npm ci
              # 3. unit testing, building
            # - name: Testing
            #   run: npm run test
            - name: Building
              run: npm run build
